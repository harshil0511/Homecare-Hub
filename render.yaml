services:
  - type: web
    name: homecare-hub-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn asgi:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://homecare-hub-gilt.vercel.app
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_USERNAME
        value: Super Admin
      - key: ANTHROPIC_API_KEY
        sync: false
